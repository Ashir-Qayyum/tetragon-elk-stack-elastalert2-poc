apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: kill-gcp-credentials-search
spec:
  kprobes:
  - call: "security_file_open"
    syscall: false
    message: "GCP credentials search detected - process killed"
    args:
    - index: 0
      type: "file"
    selectors:
  
    - matchBinaries:
      - operator: "In"
        values:
        - "/bin/grep"
        - "/usr/bin/grep"
        - "/usr/bin/egrep"
        - "/usr/bin/fgrep"
        - "/usr/bin/rgrep"
        - "/usr/bin/zgrep"
        - "/bin/find"
        - "/usr/bin/find"
        - "/bin/busybox"
        - "/usr/bin/busybox"
      matchArgs:
      - index: 0
        operator: "Prefix"
        values:
        - "/root/.config/gcloud"
        - "/home/ubuntu/.config/gcloud"    
        - "/home/appuser/.config/gcloud"
       
      matchActions:
      - action: Sigkill
   
    - matchBinaries:
      - operator: "In"
        values:
        - "/bin/grep"
        - "/usr/bin/grep"
        - "/usr/bin/egrep"
        - "/usr/bin/fgrep"
        - "/usr/bin/rgrep"
        - "/usr/bin/zgrep"
        - "/bin/find"
        - "/usr/bin/find"
        - "/bin/busybox"
        - "/usr/bin/busybox"
      matchArgs:
      - index: 0
        operator: "Postfix"
        values:
        - "application_default_credentials.json"
        - "/environ"                     
        - "service_account.json"
        - "service-account.json"
        
      matchActions:
      - action: Sigkill

